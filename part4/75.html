<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>
</head>

<body>

    <input id="taskInput" placeholder="Enter your task">

    <button id="addButton">Add</button>

    <ul id="taskList"></ul>


    <script>

        // =========================
        // STEP 1: Load saved tasks
        // =========================

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];


        // =========================
        // STEP 2: Get HTML elements
        // =========================

        const input = document.getElementById("taskInput");

        const button = document.getElementById("addButton");

        const taskList = document.getElementById("taskList");


        // =========================
        // STEP 3: Display tasks
        // =========================

        function displayTasks() {

            // Clear the old list
            taskList.innerHTML = "";

            // Go through every task
            tasks.forEach(function(task) {

                // Create <li>
                const li = document.createElement("li");

                // Put task inside <li>
                li.textContent = task;

                // Add <li> to <ul>
                taskList.appendChild(li);

            });
        }


        // =========================
        // STEP 4: Add task
        // =========================

        button.addEventListener("click", function() {

            // Get input and add it to array
            tasks.push(input.value);


            // Save array in localStorage
            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );


            // Display tasks on screen
            displayTasks();


            // Clear input box
            input.value = "";

        });


        // =========================
        // STEP 5: Display saved tasks
        // =========================

        displayTasks();

    </script>

</body>
</html>
